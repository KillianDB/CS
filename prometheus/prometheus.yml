global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'usuario-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['usuario-service:8082']
        labels:
          application: 'usuario-service'

  - job_name: 'turma-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['turma-service:8081']
        labels:
          application: 'turma-service'

  - job_name: 'reserva-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['reserva-service:8083']
        labels:
          application: 'reserva-service'

  - job_name: 'gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['gateway:8080']
        labels:
          application: 'gateway'

  - job_name: 'eureka-server'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['eurekaserver:8761']
        labels:
          application: 'eureka-server'
