server:
  port: 9000

spring:
  application:
    name: api-gateway

  config:
    import: optional:configserver:http://cloudserver:8888/

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:
        - id: turma-service
          uri: lb://turma-service
          predicates:
            - Path=/turma/**

        - id: usuario-service
          uri: lb://usuario-service
          predicates:
            - Path=/usuario/**

        - id: reserva-service
          uri: lb://reserva-service
          predicates:
            - Path=/reserva/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    gateway:
      enabled: true
