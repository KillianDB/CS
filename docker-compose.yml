version: "3.8"

services:
  cloudserver:
    build: ./cloudserver
    container_name: cloudserver
    ports:
      - "8888:8888"
    networks:
      - microservices-network
    volumes:
      - ../config_repo:/app/config-repo
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8888/actuator/health",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  eurekaserver:
    build: ./eurekaserver
    container_name: eurekaserver
    ports:
      - "8761:8761"
    networks:
      - microservices-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8761/actuator/health",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  turma-service:
    build:
      context: ./turma
      dockerfile: Dockerfile
    container_name: turma-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:turma_db
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.h2.Driver
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=
      - SPRING_JPA_HIBERNATE_DDL_AUTO=create-drop
      - SERVER_PORT=8081
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eurekaserver:8761/eureka/
      - SPRING_CONFIG_IMPORT=optional:configserver:http://cloudserver:8888/
    networks:
      - microservices-network
    depends_on:
      cloudserver:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    restart: unless-stopped

  usuario-service:
    build:
      context: ./usuario
      dockerfile: Dockerfile
    container_name: usuario-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:usuario_db
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.h2.Driver
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=
      - SPRING_JPA_HIBERNATE_DDL_AUTO=create-drop
      - SERVER_PORT=8082
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eurekaserver:8761/eureka/
      - SPRING_CONFIG_IMPORT=optional:configserver:http://cloudserver:8888/
    networks:
      - microservices-network
    depends_on:
      cloudserver:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    restart: unless-stopped

  reserva-service:
    build:
      context: ./reserva
      dockerfile: Dockerfile
    container_name: reserva-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:reserva_db
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.h2.Driver
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=
      - SPRING_JPA_HIBERNATE_DDL_AUTO=create-drop
      - SERVER_PORT=8083
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eurekaserver:8761/eureka/
      - SPRING_CONFIG_IMPORT=optional:configserver:http://cloudserver:8888/
    networks:
      - microservices-network
    depends_on:
      cloudserver:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    build: ./gateway
    container_name: gateway
    ports:
      - "9000:9000"
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://cloudserver:8888/
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eurekaserver:8761/eureka/
    depends_on:
      cloudserver:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    networks:
      - microservices-network

networks:
  microservices-network:
    driver: bridge
    name: cs-microservices-network
